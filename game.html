<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：env(safe-area-inset-*) 要有值才避得開瀏海與底部手勢條 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>貓九的滑块游戏 — 网页体验版</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #1e1e1e; }
      body {
        overflow: hidden;
        /* 關掉下拉刷新與橡皮筋：手機上拖棋盤最容易被它打斷 */
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      /* 100dvh：手機瀏覽器工具列會收合，用 100vh 會把底部狀態列頂出畫面。
         不支援 dvh 的舊瀏覽器忽略這條，退回 JS 設的 100vh。 */
      #app { height: 100vh; height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- 单文件 app.js（非 module），file:// 直接双击也可用 -->
    <!-- 注：首页背景已改用循环动图 images/anim/bg_loop.webp，不再加载 demo/animation-data.js
         （省 62KB 与一个请求）。要恢复 ?demo= 引擎播放，把这行加回来即可。 -->
    <script src="app.js"></script>
  </body>
</html>
